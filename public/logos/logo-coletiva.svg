<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="400" height="150" rx="16" fill="url(#bgGrad)" stroke="#facc15" stroke-width="3" />
  
  <rect x="10" y="10" width="380" height="130" rx="10" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="6,4" opacity="0.5" />

  <text x="200" y="55" font-family="'Courier New', monospace" font-size="28" fill="url(#textGrad)" text-anchor="middle" font-weight="900" letter-spacing="4">COLETIVA DE</text>
  <text x="200" y="100" font-family="'Arial Black', sans-serif" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="900" font-style="italic" filter="url(#glow)">IMPRENSA</text>
  
  <text x="200" y="130" font-family="'Courier New', monospace" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="900" letter-spacing="8">BMJ 2026</text>
  
  <circle cx="35" cy="75" r="8" fill="#ef4444" />
  <circle cx="365" cy="75" r="8" fill="#ef4444" />
</svg>

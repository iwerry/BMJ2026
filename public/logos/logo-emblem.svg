<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      .emblem-border {
        fill: #FFFFFF;
        stroke: #000000;
        stroke-width: 4px;
        filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.15));
      }
      .brasil-green {
        fill: #009B3A;
      }
      .brasil-yellow {
        fill: #FFDF00;
      }
      .japan-red {
        fill: #BC002D;
        stroke: #111111;
        stroke-width: 2px;
      }
    </style>
    <clipPath id="circle-clip">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
  </defs>
  
  <!-- Outer border/circle background -->
  <circle cx="60" cy="60" r="58" class="emblem-border" />
  
  <!-- Brazil Background Slices -->
  <g clip-path="url(#circle-clip)">
    <rect x="0" y="0" width="120" height="120" class="brasil-yellow" />
    <!-- Slices of green on the left half -->
    <path d="M 0,0 L 75,0 L 45,120 L 0,120 Z" class="brasil-green" />
  </g>
  
  <!-- Central Japan Hinomaru circle -->
  <circle cx="60" cy="60" r="28" class="japan-red" />
</svg>
